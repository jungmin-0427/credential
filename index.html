<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">  <!-- 검색 노출 차단 (협의용 비공개 프로토타입) -->
<title>AIR Credential End-to-End Flow</title>
<!--
  ==================== 안내 ====================
  · 목적: MOCA와 전체 플로우(AirAsia 생성 → SKP 검증 → 혜택 지급·사용) 싱크용 프로토타입
  · 기준: 정책서 v0.2 · 스토리보드 v0.6 · 캠페인 프로토타입 v0.2 · 팀 프로토타입(air-credential-prototype.vercel.app)
  · 화면 1개 = 아래 <script>의 STEPS 배열 항목 1개. 화면 문구(screen), 처리·데이터·확인 사항(panel)을 함께 관리한다.
  · 라벨: AirAsia 페이지 / AIR SDK 화면(MOCA 제공) / SKP 페이지. SDK 화면은 호스트 페이지 위 바텀시트로 표시한다.
  · SDK 메서드명·화면 구성은 가정이다. 실제 사양은 MOCA 확인(Q 번호) 후 반영한다.
  ==============================================
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --ink: #141B34; --ink-2: #4A5372; --ink-3: #8790AB; --line: #E3E7F0; --soft: #F5F7FB; --bg: #EEF1F6;
    --aa: #D7192A; --aa-soft: #FDE8EA;     /* AirAsia 영역 */
    --sdk: #5B3CC4; --sdk-soft: #EFEAFF;   /* AIR SDK (MOCA) 영역 */
    --skp: #E8461F; --skp-soft: #FFEDE7;   /* SKP 영역 */
    --ok: #1F9D6B; --ok-soft: #E4F6EE; --warn: #9A5B00; --warn-soft: #FFF4E0;
    --oy: #7DB72F; --gs: #2F7BEF; --kfv: #E07A3F;
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font: 14px/1.55 var(--font); color: var(--ink); background: var(--bg); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #6A8BFF; outline-offset: 2px; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- 상단 바 ---------- */
  .top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 20px; background: var(--ink); color: #fff; }
  .top strong { font-size: 15px; margin-right: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .tag--aa { background: var(--aa-soft); color: var(--aa); }
  .tag--sdk { background: var(--sdk-soft); color: var(--sdk); }
  .tag--skp { background: var(--skp-soft); color: var(--skp); }
  .top button { padding: 6px 12px; border: 1px solid #4A5372; border-radius: 6px; background: transparent; color: #fff; font-size: 12.5px; }
  .top button:hover { background: #26304d; }
  .lang { display: inline-flex; padding: 2px; border: 1px solid #4A5372; border-radius: 8px; }
  .lang button { border: 0 !important; padding: 4px 10px !important; border-radius: 6px !important; font-weight: 700; }
  .lang button[aria-pressed="true"] { background: #fff !important; color: var(--ink) !important; }

  /* ---------- 3단 레이아웃 ---------- */
  .layout { display: grid; grid-template-columns: 260px 400px minmax(0, 1fr); gap: 24px; max-width: 1400px; margin: 0 auto; padding: 20px; align-items: start; }
  .col { position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
  .box { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(20,27,52,.08); }
  .box + .box { margin-top: 12px; }
  .box h2 { margin: 0 0 10px; font-size: 13px; color: var(--ink-3); letter-spacing: .02em; }

  /* 여정 지도 */
  .phase { margin: 12px 0 4px; font-size: 11.5px; font-weight: 800; color: var(--ink-2); }
  .phase:first-of-type { margin-top: 0; }
  .map { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .map button { width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
  .map button:hover { background: var(--soft); }
  .map button[aria-current="true"] { background: var(--ink); color: #fff; }
  .map .n { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: 11px; font-weight: 800; color: #fff; background: var(--c); }
  .map .t { font-size: 12.5px; line-height: 1.3; }
  .map .t small { display: block; font-size: 10.5px; opacity: .7; }
  .scn label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; }
  .scn select { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }

  /* ---------- 폰 ---------- */
  .stage { position: sticky; top: 72px; }
  .owner { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; font-weight: 700; color: #fff; background: var(--c); }
  .owner small { font-weight: 600; opacity: .85; }
  .phone { position: relative; height: min(760px, calc(100vh - 190px)); min-height: 560px; border-radius: 34px; overflow: hidden; background: #fff; box-shadow: 0 0 0 9px #161A26, 0 10px 30px rgba(20,27,52,.18); display: flex; flex-direction: column; }
  .addr { flex: none; display: flex; align-items: center; gap: 6px; margin: 10px 12px 6px; padding: 7px 12px; border-radius: 10px; background: var(--soft); font-size: 11.5px; color: var(--ink-2); }
  .addr b { color: var(--ink); font-weight: 600; }
  .addr .lock { color: var(--ok); }
  .page { flex: 1; overflow: auto; position: relative; }
  .nav { display: flex; gap: 8px; margin-top: 12px; }
  .nav button { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 700; }
  .nav button:disabled { opacity: .4; cursor: default; }
  .nav .pos { flex: none; align-self: center; font-size: 12px; color: var(--ink-3); min-width: 54px; text-align: center; }

  /* 페이지 공통 */
  .p { padding: 20px; display: grid; gap: 14px; }
  .hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .hd--aa { background: var(--aa); color: #fff; }
  .hd--skp { background: #fff; border-bottom: 1px solid var(--line); }
  .wm-aa { font-weight: 900; font-size: 20px; letter-spacing: -.04em; font-style: italic; }
  .wm-skp { display: flex; align-items: center; gap: 6px; font-weight: 800; }
  .wm-skp i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: var(--skp); color: #fff; font-style: normal; font-size: 11px; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c, var(--skp)); }
  .h1 { margin: 0; font-size: 28px; line-height: 1.18; letter-spacing: -.02em; font-weight: 800; }
  .h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -.01em; }
  .lead { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.55; }
  .fine { margin: 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 0 16px; border: 0; border-radius: 12px; font-weight: 700; font-size: 15px; }
  .btn--aa { background: var(--aa); color: #fff; }
  .btn--skp { background: var(--skp); color: #fff; }
  .btn--dark { background: var(--ink); color: #fff; }
  .btn--line { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn:disabled { background: #D5D9E3; color: #fff; cursor: not-allowed; }
  .card { padding: 14px 16px; border-radius: 14px; background: var(--soft); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .steps li::before { content: counter(s); display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--c, var(--skp)); color: #fff; font-size: 11px; font-weight: 800; }
  .steps li b { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 11.5px; font-weight: 700; }
  .kv { margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .kv div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; font-size: 12.5px; }
  .kv div + div { border-top: 1px solid var(--line); }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-weight: 700; text-align: right; }
  .alert { display: flex; gap: 8px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.45; background: var(--skp-soft); color: var(--ink-2); }
  .alert--danger { background: #FDECEC; color: #9B1C20; }

  /* Credential 카드 */
  .vc { position: relative; aspect-ratio: 1.6; border-radius: 16px; padding: 16px; color: var(--fg); background: var(--bgc); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 24px rgba(20,27,52,.2); }
  .vc::after { content: ""; position: absolute; right: -30%; bottom: -55%; width: 75%; aspect-ratio: 1; border-radius: 50%; border: 1px solid currentColor; opacity: .18; }
  .vc__top { display: flex; justify-content: space-between; align-items: center; }
  .vc__logo { font: italic 800 24px/1 Georgia, serif; }
  .vc__st { padding: 3px 10px; border-radius: 999px; background: var(--ok); color: #fff; font-size: 11px; font-weight: 700; }
  .vc__ey { margin-top: auto; font-size: 9.5px; font-weight: 800; letter-spacing: .12em; opacity: .75; }
  .vc__t { margin: 3px 0 6px; font-size: 18px; font-weight: 600; }
  .vc__m { font-size: 9px; font-weight: 700; letter-spacing: .14em; opacity: .7; line-height: 1.8; }
  [data-tier="member"]   { --bgc: linear-gradient(135deg, #FF6B6E, #D11A2A 85%); --fg: #fff; }   /* AirAsia Rewards 회원 Credential (등급 구분 없음) */

  /* 티켓 */
  .tickets { display: grid; gap: 8px; }
  .ticket { display: grid; grid-template-columns: 70px 1fr; min-height: 76px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(20,27,52,.1); overflow: hidden; }
  .ticket__stub { display: grid; place-items: center; background: var(--brand); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
  .ticket__body { padding: 10px 12px; border-left: 2px dashed var(--line); display: grid; align-content: center; }
  .ticket__body small { font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .ticket__body b { font-size: 18px; letter-spacing: -.02em; }
  .ticket__body span { font-size: 12px; color: var(--ink-2); }
  .ticket__body .open { justify-self: start; margin-top: 4px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 11.5px; font-weight: 700; }
  .pkg { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--soft); }
  .pkg__h { display: flex; justify-content: space-between; align-items: flex-start; }
  .pkg__h b { font-size: 16px; } .pkg__h small { display: block; font-size: 11px; color: var(--ink-3); }
  .pkg__tot { text-align: right; font-size: 10.5px; color: var(--ink-3); } .pkg__tot b { display: block; font-size: 19px; color: var(--ink); }
  .done { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 13px; }

  /* 동의 */
  .consent { border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
  .consent label { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 12.5px; cursor: pointer; }
  .consent label + label { border-top: 1px solid var(--line); }
  .consent label:first-child { background: var(--soft); font-weight: 800; font-size: 14px; }
  .consent input { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); flex: none; }
  .consent .req { color: var(--skp); font-weight: 700; }
  .consent .xb { color: var(--warn); }

  /* SDK 바텀시트 */
  .dim { position: absolute; inset: 0; background: rgba(20,27,52,.5); z-index: 5; }
  .host { pointer-events: none; }
  .sdk { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 20px 20px 14px; border-radius: 22px 22px 0 0; background: #fff; display: grid; gap: 12px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
  .sdk::before { content: ""; justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin-top: -8px; }
  .sdk__app { display: flex; align-items: center; gap: 10px; }
  .sdk__app i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: #fff; font-style: normal; font-weight: 900; font-size: 13px; background: var(--c); }
  .sdk__app b { display: block; font-size: 14px; } .sdk__app small { font-size: 11.5px; color: var(--ink-3); }
  .sdk__t { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .sdk__row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--soft); font-size: 13px; }
  .sdk__row b { font-size: 14px; }
  .sdk__pw { text-align: center; font-size: 11px; color: var(--ink-3); }
  .sdk__pw b { color: var(--ink); font-style: italic; font-family: Georgia, serif; }
  .sdk .btn--sdk { background: var(--ink); color: #fff; }
  .spin { justify-self: center; width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--sdk-soft); border-top-color: var(--sdk); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .okmark { justify-self: center; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); font-size: 26px; }

  /* 바코드 */
  .voucher { border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(20,27,52,.14); }
  .voucher__h { padding: 16px; background: var(--brand); color: #fff; } .voucher__h b { display: block; font-size: 28px; }
  .voucher__b { padding: 18px 16px; background: #fff; text-align: center; }
  .bars { height: 70px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px); }
  .code { margin-top: 6px; font-weight: 700; letter-spacing: .14em; }

  /* ---------- S-01 SKP 메인 (서울 테마) ---------- */
  .s01-hero { padding: 22px 20px 34px; background: radial-gradient(120% 60% at 100% 0%, #FFE3D8 0%, transparent 60%), radial-gradient(90% 60% at 0% 30%, #DCE9FF 0%, transparent 65%), #E8F1FF; }
  .s01-hero .h1 em { font-style: normal; color: var(--skp); }
  .s01-visual { position: relative; margin: 18px 0 16px; }
  .seoul { display: block; width: 100%; height: auto; }
  .s01-visual .float { position: absolute; box-shadow: 0 2px 8px rgba(20,27,52,.12); animation: bob 3.2s ease-in-out infinite; }
  .s01-visual .f1 { left: 8px; top: 10px; } .s01-visual .f2 { left: 34%; bottom: -10px; animation-delay: -1.2s; } .s01-visual .f3 { right: 8px; bottom: 26%; animation-delay: -2s; }
  .sticker { position: absolute; right: 22px; top: -10px; padding: 8px 12px; border-radius: 12px; background: var(--skp); color: #fff; font-size: 11px; font-weight: 900; line-height: 1.15; text-align: center; transform: rotate(8deg); box-shadow: 0 4px 10px rgba(232,70,31,.3); }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .s01-visual .float { animation: none; } }
  .s01-period { margin: 12px 0 0; text-align: center; font-size: 12.5px; color: var(--ink-2); }
  .s01-sec { padding: 36px 20px; }
  .s01-head { display: grid; justify-items: center; gap: 6px; margin-bottom: 18px; text-align: center; }
  .s01-num { padding: 3px 0; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
  .s01-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .s01-steps li { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #fff; box-shadow: 0 1px 4px rgba(20,27,52,.08); }
  .s01-steps i { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--skp-soft); font-style: normal; font-size: 20px; }
  .s01-steps small { font-size: 10.5px; font-weight: 800; color: var(--skp); letter-spacing: .06em; }
  .s01-steps b { display: block; font-size: 14.5px; } .s01-steps p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
  .s01-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 999px; background: #fff; box-shadow: 0 1px 4px rgba(20,27,52,.08); }
  .s01-tabs button { min-height: 36px; border: 0; border-radius: 999px; background: none; font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
  .s01-tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .s01-brands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .s01-brands > div { display: grid; justify-items: center; gap: 4px; padding: 14px 6px; border-radius: 14px; background: #fff; box-shadow: 0 1px 4px rgba(20,27,52,.08); text-align: center; }
  .s01-brands i { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--b); font-style: normal; font-size: 20px; }
  .s01-brands b { font-size: 12.5px; line-height: 1.25; } .s01-brands span { font-size: 10.5px; color: var(--ink-3); }
  .s01-faq { border-top: 1px solid var(--line); }
  .s01-faq details { border-bottom: 1px solid var(--line); }
  .s01-faq summary { padding: 13px 0; font-weight: 700; font-size: 14px; cursor: pointer; }
  .s01-faq p { margin: 0 0 12px; padding: 12px; border-radius: 10px; background: var(--soft); font-size: 12.5px; color: var(--ink-2); }
  .s01-notes ul { margin: 6px 0 0; padding-left: 16px; font-size: 11.5px; color: var(--ink-2); display: grid; gap: 4px; }
  .s01-foot { padding: 20px 20px 90px; background: var(--ink); color: #9AA3BF; font-size: 11px; line-height: 1.6; }
  .s01-foot b { color: #fff; }
  .s01-dock { position: sticky; bottom: 0; padding: 10px 16px 14px; background: linear-gradient(to top, #fff 70%, rgba(255,255,255,0)); transition: transform .25s, opacity .25s; }
  .s01-dock.is-hidden { transform: translateY(100%); opacity: 0; pointer-events: none; } /* 히어로 버튼이 보이면 숨김 */
  .overlay { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
  .overlay:not(:empty) { pointer-events: auto; }
  .sheet-skp { border-top: 3px solid var(--skp); }
  .sheet-v { max-height: 90%; overflow: auto; }
  /* 상단 바 Help 아이콘 · 문의 시트 · 내 쿠폰 진입 링크 */
  .hd-r { display: flex; align-items: center; gap: 6px; }
  .hd-help { display: grid; place-items: center; width: 30px; height: 30px; border: 1.5px solid var(--line); border-radius: 50%; background: #fff; font-weight: 800; font-size: 14px; color: var(--ink-2); }
  .hd-help:hover { border-color: var(--ink-2); }
  .s01-myv { display: block; width: 100%; margin-top: 10px; padding: 6px; border: 0; background: none; font-size: 13px; color: var(--ink-2); }
  .s01-myv b { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .fld { display: grid; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
  .fld select, .fld textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font: 400 14px var(--font); color: var(--ink); background: #fff; }
  .fld textarea { min-height: 100px; resize: vertical; }
  .fld small { justify-self: end; font-weight: 500; color: var(--ink-3); }
  .inq { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; }
  .inq__top { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-3); font-weight: 600; font-size: 11.5px; }

function bindDock() {
  const pg = $('#page'), cta = $('.s01-cta', pg), dock = $('.s01-dock', pg);
  if (!cta || !dock) { pg.onscroll = null; return; }
  const sync = () => { const r = cta.getBoundingClientRect(), v = pg.getBoundingClientRect(); dock.classList.toggle('is-hidden', r.bottom > v.top && r.top < v.bottom); };
  pg.onscroll = sync; sync();
}

/* ===== 렌더 ===== */
let cur = 0;
function show(id) {
  const next = typeof id === 'number' ? id : IDX[id];
  if (next !== cur) { S.sdk = 0; S.confirm = S.issuing = false; S.help = null; if (STEPS[next].id !== 'S-04') S.vopen = null; } // 다른 화면으로 가면 시트 상태 초기화
  cur = next;
  const s = STEPS[cur], o = OWN[s.own];
  if (s.id === 'S-03') S.verified = true;
  if (s.id === 'S-05') { S.loggedIn = true; S.help = S.help || 'form'; }   // 문의 단계는 로그인 상태로 시연
  $('#owner').style.setProperty('--c', o.c);
  $('#owner').innerHTML = `<span>${ownLabel(s.own)}${s.host ? ` <small>· ${t('over_' + s.host)}</small>` : ''}</span><small>${s.id}</small>`;
  $('#addr').innerHTML = `<svg class="i lock"><use href="#i-lock"/></svg><b>${s.url}</b>${s.host === 'aa' || s.own === 'aa' ? `<span class="fine">${t('ex')}</span>` : ''}`;
  $('#page').innerHTML = s.screen();
  $('#page').scrollTop = 0;
  renderOverlay();
  bindDock();
  $('#pos').textContent = `${cur + 1} / ${STEPS.length}`;
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === STEPS.length - 1;
  renderInfo(s);
  $$('#map button').forEach(b => b.setAttribute('aria-current', b.dataset.goto === s.id));
  bindConsent();
}
function renderOverlay() {
  const s = STEPS[cur];
  $('#overlay').innerHTML = S.help ? `<div class="dim" data-help-close></div><div class="sdk sheet-skp sheet-v">${helpSheet()}</div>` : (s.overlay ? s.overlay() : '');
}
function renderInfo(s) {
  const p = L(s);
  $('#info').innerHTML = `
    <span class="tag tag--${s.own}">${ownLabel(s.own)}</span>
    <h1 style="margin-top:8px"><span class="sid">${s.id}</span>${p.name}</h1>
    <dl class="meta"><dt>Phase</dt><dd>${t('ph')[s.phase]}</dd><dt>${t('who')}</dt><dd>${p.who}</dd><dt>${t('where')}</dt><dd>${p.where}</dd><dt>URL</dt><dd><code>${s.url}</code>${s.host === 'aa' || s.own === 'aa' ? ' ' + t('ex') : ''}</dd></dl>
    ${p.proc.length ? `<h3><svg class="i"><use href="#i-gear"/></svg>${t('proc')}</h3><ol>${p.proc.map(x => `<li>${x}</li>`).join('')}</ol>
    <h3><svg class="i"><use href="#i-data"/></svg>${t('data')}</h3>
    ${p.data.length ? `<table><tr><th>${t('dir')}</th><th>${t('item')}</th></tr>${p.data.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>` : `<p class="none">${t('none')}</p>`}
    <h3><svg class="i"><use href="#i-q"/></svg>${t('ask')}</h3>
    ${p.ask.length ? `<div class="ask"><ul>${p.ask.map(x => `<li>${x.replace(/^(Q\d+\.)/, '<b>$1</b>')}</li>`).join('')}</ul></div>` : `<p class="none">${t('ask_none')}</p>`}` : ''}`;   // 처리 내용이 없는 참고 화면(A-AUTH)은 화면 정보만 표시
}
function renderMap() {
  let html = '', ph = 0;
  STEPS.forEach((s, i) => {
    if (s.phase !== ph) { if (ph) html += '</ol>'; ph = s.phase; html += `<div class="phase">${t('ph')[ph]}</div><ol class="map">`; }
    html += `<li><button type="button" data-goto="${s.id}" style="--c:${OWN[s.own].c}"><span class="n">${i + 1}</span><span class="t">${L(s).name}${s.branch ? ` <small>${t('branch')}</small>` : ''}<small>${s.id} · ${ownLabel(s.own)}</small></span></button></li>`;
  });
  $('#map').innerHTML = html + '</ol>';
}
function renderSummary() {
  $('#sum-table').innerHTML = `<tr>${t('th').map(h => `<th>${h}</th>`).join('')}</tr>` +
    STEPS.map((s, i) => { const p = L(s); return `<tr data-go="${s.id}"><td>${i + 1}</td><td><b>${s.id}</b><br>${p.name}</td><td><span class="tag tag--${s.own}">${ownLabel(s.own)}</span></td>
      <td>${p.proc.join('<br>')}</td><td>${p.data.map(([a, b]) => `${a}: ${b}`).join('<br>') || '-'}</td><td>${p.ask.map(x => x.split('.')[0]).join(', ') || '-'}</td></tr>`; }).join('');
}

const $ = (q, el = document) => el.querySelector(q), $$ = (q, el = document) => [...el.querySelectorAll(q)];
function bindConsent() {
  const box = $('#consent'); if (!box) return;
  const flag = box.dataset.flag || 'agreed', btn = $(box.dataset.btn || '#btn-agree');   // S-02: SKP 동의 · A-AUTH: AirAsia 동의
  const gate = () => flag !== 'aaAgreed' || S.otp === 'ok';                              // AirAsia 동의는 이메일 인증까지 끝나야 진행
  const items = $$('[data-c]', box), all = $('[data-all]', box);
  const sync = () => { const ok = items.every(c => c.checked); all.checked = ok; btn.disabled = !(ok && gate()); };
  box.sync = sync;
  items.forEach(c => { c.checked = S[flag]; c.onchange = sync; });
  all.onchange = () => { items.forEach(c => { c.checked = all.checked; }); sync(); };
  sync();
}

/* ===== 이벤트 ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-goto], [data-sdk], [data-login], [data-claim], [data-cancel], [data-confirm], [data-tab], [data-vo], [data-vclose], [data-v], [data-help], [data-help-close], [data-help-new], [data-help-home], [data-help-send], [data-help-login], [data-myv], [data-otp], tr[data-go]');
  if (!el) return;
  /* 문의 시트 */
  if (el.hasAttribute('data-help')) { S.help = 'form'; return renderOverlay(); }   // ? 아이콘 → 바로 문의 입력
  if (el.hasAttribute('data-help-close')) { S.help = null; return renderOverlay(); }
  if (el.hasAttribute('data-help-new')) { S.help = 'form'; return renderOverlay(); }
  if (el.hasAttribute('data-help-home')) { S.help = 'home'; return renderOverlay(); }
  if (el.hasAttribute('data-help-send')) {
    S.inq.push({ topic: $('#inq-topic').value, text: $('#inq-text').value.trim(), date: today(), status: 'received' });
    S.help = 'home'; return renderOverlay();
  }
  if (el.hasAttribute('data-help-login')) { S.help = null; S.afterLogin = 'help'; return show('S-LOGIN'); }
  if (el.hasAttribute('data-myv')) { S.afterLogin = 'vouchers'; return show('S-LOGIN'); }   // 메인: View my vouchers
  const redraw = () => { const pg = $('#page'), top = pg.scrollTop; pg.innerHTML = STEPS[cur].screen(); pg.scrollTop = top; bindDock(); };
  if (el.dataset.vo !== undefined) { S.vopen = +el.dataset.vo; return renderOverlay(); }   // S-04 쿠폰 → 바코드 시트
  if (el.hasAttribute('data-vclose')) { S.vopen = null; return renderOverlay(); }
  if (el.dataset.v !== undefined) S.vopen = +el.dataset.v;                   // 11번 View voucher → S-04에서 해당 쿠폰 시트 열기
  if (el.hasAttribute('data-claim')) { S.confirm = true; return renderOverlay(); }   // 받기 확인 시트 열기
  if (el.hasAttribute('data-cancel')) { S.confirm = false; return renderOverlay(); }
  if (el.hasAttribute('data-confirm')) {                                     // 지급 처리 → S-04 혜택 상세
    S.issuing = true; renderOverlay();
    return setTimeout(() => { S.claimed = true; S.vopen = null; show('S-04'); }, 1000);
  }
  if (el.matches('tr[data-go]')) { $('#modal').hidden = true; return show(el.dataset.go); }
  if (el.dataset.otp) { S.otp = el.dataset.otp; $('#otp').innerHTML = otpBlock(); return $('#consent').sync(); }   // A-AUTH 이메일 인증: 체크 상태는 유지
  if (el.id === 'btn-agree') S.agreed = true;
  if (el.id === 'btn-aa-agree') S.aaAgreed = true;
  if (el.dataset.goto) return show(el.dataset.goto);
  if (el.hasAttribute('data-login')) {                         // SKP 로그인 후 분기
    const after = S.afterLogin; S.afterLogin = null; S.loggedIn = true;
    if (S.scn === 'returning') { S.verified = true; S.claimed = true; }
    if (after === 'help') { show('S-01'); S.help = 'form'; return renderOverlay(); }   // 문의하려고 로그인 → 문의 입력으로 복귀
    if (after === 'vouchers' && S.claimed) { S.vopen = null; return show('S-04'); }    // 수령 고객 → 내 쿠폰 목록
    if (S.claimed || S.verified) return show('S-03P');                                 // 검증만 한 고객 → 쿠폰 받기
    return show(S.agreed ? 'S-VERIFY' : 'S-02');
  }
  if (el.dataset.sdk) {                                         // SDK 시트 내부 진행 (확인 → 처리 중 → 완료)
    S.sdk = 1; $('#page').innerHTML = STEPS[cur].screen();
    setTimeout(() => { S.sdk = 2; if (['A-ISSUE', 'S-VERIFY'].includes(STEPS[cur].id)) $('#page').innerHTML = STEPS[cur].screen(); }, 1100);
  }
});
$('#prev').addEventListener('click', () => show(Math.max(0, cur - 1)));
$('#next').addEventListener('click', () => show(Math.min(STEPS.length - 1, cur + 1)));
$$('input[name=scn]').forEach(r => r.addEventListener('change', e => {
  S.scn = e.target.value; S.claimed = S.verified = S.agreed = S.scn === 'returning'; S.loggedIn = false; S.afterLogin = null; S.otp = ''; S.aaAgreed = false;
  show(S.scn === 'normal' ? 'A-01' : 'S-01');
}));
$('#btn-summary').addEventListener('click', () => { renderSummary(); $('#modal').hidden = false; });
$('#sum-close').addEventListener('click', () => { $('#modal').hidden = true; });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#modal').hidden = true;
  if (e.target.matches('input, select')) return;
  if (e.key === 'ArrowRight') $('#next').click();
  if (e.key === 'ArrowLeft') $('#prev').click();
});

// 문의 입력(게시판형): 글자 수 표시, 내용이 있어야 Send 활성 (이메일 미수집)
document.addEventListener('input', e => {
  if (e.target.id !== 'inq-text') return;
  $('#inq-count').textContent = `${e.target.value.length.toLocaleString('en-US')} / 1,000`;
  $('[data-help-send]').disabled = !e.target.value.trim();
});
// Admin 시뮬레이션: 가장 최근 미답변 문의에 답변 등록
$('#op-answer').addEventListener('click', () => {
  const q = S.inq.slice().reverse().find(x => x.status !== 'answered');
  if (!q) return alert(t('admin_none'));
  q.status = 'answered';
  q.reply = 'Thanks for reaching out. We checked your promotion history and your voucher was issued successfully. You can find it in My voucher.';
  renderOverlay();
});
$$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
setLang(LANG);   // 언어 적용 + 지도·첫 화면 렌더 (?lang=en 으로 영어 링크 공유 가능)
show(0);
</script>
</body>
</html>
